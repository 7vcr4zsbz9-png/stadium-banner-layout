<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幕の画像配置ツール</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#21312e;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}header{padding:20px 26px;background:#164b43;color:white}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#d7e8e1;font-size:14px}.page{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}.card{background:white;border:1px solid #dce4df;border-radius:13px;padding:17px;box-shadow:0 3px 12px #22392e0b}.wallcard{min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.size{display:flex;align-items:center;gap:6px;font-size:14px}.size input,.measure input{width:78px}input,button{font:inherit}input[type=number],input[type=text]{border:1px solid #cbd6d0;border-radius:7px;padding:8px}input[type=file]{display:block;width:100%;padding:12px;background:#f6f9f7;border:1px dashed #8da99c;border-radius:8px}.wallScroll{overflow:auto;padding:18px 2px 8px}.wall{position:relative;margin:auto;background-color:#e6ebe6;background-image:linear-gradient(90deg,#ffffff80 1px,transparent 1px),linear-gradient(#ffffff80 1px,transparent 1px);background-size:5% 10%;border:2px solid #77867e;box-shadow:0 4px 12px #22392e14;touch-action:none;overflow:hidden}.wall:after{content:"スタジアムの壁";position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-size:clamp(20px,4vw,50px);font-weight:800;color:#5e71661c;pointer-events:none}.piece{position:absolute;z-index:1;overflow:hidden;cursor:move;touch-action:none;user-select:none;border:1px solid #fff;box-shadow:0 1px 4px #23382c55}.piece.selected{outline:3px solid #f2a44a;z-index:5}.piece img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}.piece .label{position:absolute;inset:auto 0 0;background:#0008;color:white;text-shadow:0 1px 2px black;font-size:11px;padding:2px 4px;pointer-events:none}.right{display:grid;gap:14px}.right h2{font-size:16px;margin:0 0 12px}.field{display:grid;gap:5px;font-size:13px;color:#53645e;margin:9px 0}.measure{display:flex;gap:10px}.measure label{display:grid;gap:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:7px;background:#11796b;color:white;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:650}.btn:hover{filter:brightness(.94)}.btn.light{background:#eaf1ed;color:#22554b}.btn.warn{background:#fff0e7;color:#934d31}.list{display:grid;gap:8px;max-height:330px;overflow:auto}.banner{display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:center;border:1px solid #e0e7e2;border-radius:8px;padding:7px}.thumb{width:74px;height:52px;object-fit:fill;background:#edf1ed;border-radius:4px}.banner strong{display:block;font-size:13px}.banner small{display:block;color:#697871;font-size:12px;margin:2px 0 6px}.hint{font-size:12px;color:#697871;line-height:1.55;margin:10px 0 0}.status{min-height:20px;color:#866243;font-size:12px;margin-top:8px}.stats{font-size:13px;color:#586a62}.empty{font-size:13px;color:#7a8881}@media(max-width:920px){.page{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr}}@media(max-width:600px){header{padding:16px}.page{padding:12px}.right{grid-template-columns:1fr}.size{flex-wrap:wrap}}
</style></head><body><header><h1>幕の画像配置ツール</h1><p>画像を実物の寸法に合わせて壁に配置します</p></header>
<main class="page"><section class="card wallcard"><div class="bar"><div class="size">壁のサイズ　縦 <input id="wallH" type="number" min="0.1" step="0.1" value="2.5"> m × 横 <input id="wallW" type="number" min="0.1" step="0.1" value="11.3"> m <button class="btn light" id="applyWall">変更</button></div><div class="actions" style="margin:0"><button class="btn light" id="export">配置を保存</button><label class="btn light" style="cursor:pointer">配置を読み込む<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="wallScroll"><div class="wall" id="wall"></div></div><div class="bar"><span class="stats" id="stats"></span><button class="btn warn" id="clear">壁の配置を全部消す</button></div><div class="status" id="status"></div></section>
<aside class="right"><section class="card"><h2>① 幕の画像を登録</h2><label class="field">画像ファイル（PNG・JPGなど）<input id="file" type="file" accept="image/*"></label><label class="field">幕の名前<input id="name" type="text" placeholder="例：メイン幕"></label><div class="measure"><label class="field">実物の縦（m）<input id="height" type="number" min="0.01" step="0.01" value="1"></label><label class="field">実物の横（m）<input id="width" type="number" min="0.01" step="0.01" value="2"></label></div><div class="actions"><button class="btn" id="register">この画像と寸法で登録</button></div><p class="hint">画像の形に関係なく、入力した縦×横の寸法にぴったり合わせて表示します。</p></section>
<section class="card"><h2>② 登録した幕を壁に置く</h2><div class="list" id="list"></div><p class="hint">「壁に追加」を押すと壁の中に配置されます。壁の幕をつかんで動かしてください。壁からはみ出さず、好きな場所へ移動できます。</p></section>
<section class="card"><h2>選択中の幕</h2><div class="stats" id="selected">壁の幕をクリックして選択</div><div class="actions"><button class="btn light" id="rotate">縦横を入れ替え</button><button class="btn warn" id="remove">壁から外す</button></div></section></aside></main>
<script>
const $=s=>document.querySelector(s),DB='banner-image-layout-v2';let data;try{data=JSON.parse(localStorage.getItem(DB))||{wall:{w:11.3,h:2.5},banners:[],pieces:[]}}catch{data={wall:{w:11.3,h:2.5},banners:[],pieces:[]}}let selected=null;const wall=$('#wall'),uid=()=>Math.random().toString(36).slice(2,10);function save(){try{localStorage.setItem(DB,JSON.stringify(data));$('#status').textContent='このブラウザーに自動保存しました'}catch{$('#status').textContent='保存容量を超えました。配置を保存からファイルに書き出してください'}setTimeout(()=>$('#status').textContent='',2500)}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let ww=Math.min(1050,wall.parentElement.clientWidth-8);if(innerWidth<600)ww=Math.max(ww,520);wall.style.width=ww+'px';wall.style.height=(ww*data.wall.h/data.wall.w)+'px';$('#wallW').value=data.wall.w;$('#wallH').value=data.wall.h;renderList();renderPieces();stats()}
function renderList(){let box=$('#list');box.innerHTML='';if(!data.banners.length){box.innerHTML='<div class="empty">まだ幕がありません。上で画像を選んで登録してください。</div>';return}data.banners.forEach(b=>{let row=document.createElement('div');row.className='banner';let image=document.createElement('img');image.className='thumb';image.src=b.src;let details=document.createElement('div');details.innerHTML=`<strong>${esc(b.name)}</strong><small>縦 ${b.h} m × 横 ${b.w} m</small>`;let add=document.createElement('button');add.className='btn';add.textContent='壁に追加';add.onclick=()=>addPiece(b.id);let del=document.createElement('button');del.className='btn warn';del.textContent='登録を削除';del.onclick=()=>{data.banners=data.banners.filter(x=>x.id!==b.id);data.pieces=data.pieces.filter(x=>x.bannerId!==b.id);render();save()};let box2=document.createElement('div');box2.append(details,add,del);row.append(image,box2);box.append(row)})}
function renderPieces(){wall.innerHTML='';data.pieces.forEach(p=>{let b=data.banners.find(x=>x.id===p.bannerId);if(!b)return;let pw=p.rot?b.h:b.w,ph=p.rot?b.w:b.h,el=document.createElement('div');el.className='piece'+(p.id===selected?' selected':'');el.style.left=p.x*100+'%';el.style.top=p.y*100+'%';el.style.width=pw/data.wall.w*100+'%';el.style.height=ph/data.wall.h*100+'%';let im=document.createElement('img');im.src=b.src;el.append(im);let label=document.createElement('span');label.className='label';label.textContent=`${b.name} (${ph}×${pw}m)`;el.append(label);el.title=`${b.name}｜縦 ${ph}m × 横 ${pw}m`;el.addEventListener('pointerdown',e=>{e.preventDefault();selected=p.id;wall.querySelectorAll('.piece').forEach(q=>q.classList.remove('selected'));el.classList.add('selected');showSelected();let rect=wall.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y;const move=ev=>{p.x=Math.max(0,Math.min(1-pw/data.wall.w,ox+(ev.clientX-sx)/rect.width));p.y=Math.max(0,Math.min(1-ph/data.wall.h,oy+(ev.clientY-sy)/rect.height));el.style.left=p.x*100+'%';el.style.top=p.y*100+'%'};const up=()=>{window.removeEventListener('pointermove',move);save();stats()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',up,{once:true})});wall.append(el)});showSelected()}
function addPiece(id){let b=data.banners.find(x=>x.id===id);if(!b)return;let pw=b.w/data.wall.w,ph=b.h/data.wall.h,p={id:uid(),bannerId:id,x:Math.max(0,(1-pw)/2),y:Math.max(0,(1-ph)/2),rot:false};data.pieces.push(p);selected=p.id;renderPieces();stats();save()}function showSelected(){let p=data.pieces.find(x=>x.id===selected),b=p&&data.banners.find(x=>x.id===p.bannerId);$('#selected').textContent=b?`${b.name}　縦 ${p.rot?b.w:b.h} m × 横 ${p.rot?b.h:b.w} m`:'壁の幕をクリックして選択'}function stats(){let total=data.pieces.length;$('#stats').textContent=`壁 ${data.wall.h} × ${data.wall.w} m　｜　配置中 ${total} 枚`}
$('#file').onchange=()=>{let f=$('#file').files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでください');return}let reader=new FileReader();reader.onload=()=>{$('#status').textContent='選択中の画像：'+f.name};reader.readAsDataURL(f)};
$('#register').onclick=()=>{let f=$('#file').files[0],w=Number($('#width').value),h=Number($('#height').value);if(!f){alert('先に「画像ファイル」から幕の画像を選んでください');return}if(!(w>0&&h>0)){alert('幕の実物の縦と横を入力してください');return}let reader=new FileReader();reader.onload=()=>{let b={id:uid(),name:$('#name').value.trim()||f.name.replace(/\.[^.]+$/,''),w,h,src:reader.result};data.banners.push(b);$('#file').value='';$('#name').value='';renderList();save()};reader.readAsDataURL(f)};
$('#applyWall').onclick=()=>{let w=Number($('#wallW').value),h=Number($('#wallH').value);if(!(w>0&&h>0))return;data.wall={w,h};data.pieces.forEach(p=>{let b=data.banners.find(x=>x.id===p.bannerId);if(b){let pw=(p.rot?b.h:b.w)/w,ph=(p.rot?b.w:b.h)/h;p.x=Math.min(p.x,Math.max(0,1-pw));p.y=Math.min(p.y,Math.max(0,1-ph))}});render();save()};$('#rotate').onclick=()=>{let p=data.pieces.find(x=>x.id===selected);if(p){p.rot=!p.rot;let b=data.banners.find(x=>x.id===p.bannerId),pw=(p.rot?b.h:b.w)/data.wall.w,ph=(p.rot?b.w:b.h)/data.wall.h;p.x=Math.min(p.x,Math.max(0,1-pw));p.y=Math.min(p.y,Math.max(0,1-ph));renderPieces();save()}};$('#remove').onclick=()=>{data.pieces=data.pieces.filter(p=>p.id!==selected);selected=null;renderPieces();stats();save()};$('#clear').onclick=()=>{data.pieces=[];selected=null;renderPieces();stats();save()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='幕レイアウト.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.wall||!Array.isArray(d.banners)||!Array.isArray(d.pieces))throw Error();data=d;selected=null;render();save()}catch{alert('幕レイアウトのJSONファイルを選んでください')}e.target.value=''};render();window.addEventListener('resize',render);
</script></body></html>
